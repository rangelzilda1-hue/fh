<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandbox RPG Engine</title>
  <style>
    :root {
      --bg-main: #090d16;
      --bg-panel: #111827;
      --bg-input: #1f2937;
      --border: #374151;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --user-msg: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 850px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      margin-top: 0;
      color: var(--accent);
      font-size: 1.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .config-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    label {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }
    input[type="password"], input[type="text"], textarea {
      width: 100%;
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: var(--accent);
    }
    #storyBox {
      height: 420px;
      overflow-y: auto;
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 16px;
      line-height: 1.65;
      white-space: pre-wrap;
    }
    .turn-user {
      color: var(--user-msg);
      font-weight: 600;
      margin: 12px 0;
      padding-left: 10px;
      border-left: 3px solid var(--user-msg);
    }
    .turn-narrator {
      color: var(--text-main);
      margin: 12px 0;
    }
    .divider {
      border: 0;
      border-top: 1px solid #1f2937;
      margin: 16px 0;
    }
    .action-bar {
      display: flex;
      gap: 10px;
    }
    button {
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary {
      background: #374151;
      color: var(--text-main);
      font-weight: 600;
    }
    button.secondary:hover { background: #4b5563; }
    .toolbar {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      <span>🎲 Sandbox RPG Engine</span>
      <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: normal;">GitHub Pages Edition</span>
    </h1>

    <div class="config-grid">
      <div>
        <label for="apiKey">🔑 Chave da API (Google Gemini) — Salva apenas no seu navegador:</label>
        <input type="password" id="apiKey" placeholder="Cole sua chave AIzaSy... aqui" onchange="saveKey()">
      </div>
      <div>
        <label for="scenarioInput">🌍 Cenário, Universo e Personagem:</label>
        <textarea id="scenarioInput" rows="2" placeholder="Ex: Cyberpunk 2099 em uma metrópole chuvosa. Sou um investigador particular sem implantes..."></textarea>
      </div>
    </div>

    <div id="storyBox"><span style="color: var(--text-muted);"><i>Configure sua chave de API e o cenário acima, depois digite sua primeira ação ou clique em "Iniciar Mundo".</i></span></div>

    <div class="action-bar">
      <input type="text" id="actionInput" placeholder="Digite sua fala ou ação..." onkeydown="if(event.key==='Enter') sendAction()">
      <button onclick="sendAction()">Agir</button>
    </div>

    <div class="toolbar">
      <button class="secondary" onclick="startWorld()">Iniciar Mundo</button>
      <button class="secondary" onclick="exportStory()">Baixar História (.txt)</button>
      <button class="secondary" onclick="clearStory()">Resetar</button>
    </div>
  </div>

  <script>
    const SYSTEM_PROMPT = `Você é um Motor de Simulação e Mestre de RPG de Texto Sandbox implacável, detalhista e adaptável.
REGRAS INQUEBRÁVEIS DE AGÊNCIA:
1. NUNCA fale, pense, sinta, decida ou aja pelo personagem do jogador. O personagem do jogador pertence 100% ao usuário.
2. Controle apenas o ambiente, clima, eventos do mundo e NPCs.
3. Detalhe o cenário com riqueza sensorial (visão, som, cheiro, atmosfera) e mostre as emoções reais dos NPCs através de expressões, postura e tom de voz.
4. Mantenha total coerência lógica. Pare a narração imediatamente sempre que a cena exigir uma reação do jogador, sem dar opções (A, B, C) e sem perguntar "O que você faz?".`;

    let chatHistory = [];

    window.onload = () => {
      const savedKey = localStorage.getItem("rpg_gemini_api_key");
      if (savedKey) document.getElementById("apiKey").value = savedKey;
    };

    function saveKey() {
      const key = document.getElementById("apiKey").value.trim();
      localStorage.setItem("rpg_gemini_api_key", key);
    }

    async function callGemini(promptText) {
      const apiKey = document.getElementById("apiKey").value.trim();
      if (!apiKey) {
        alert("Insira sua chave de API do Google Gemini primeiro!");
        return null;
      }

      const contents = chatHistory.slice(-16).map(item => ({
        role: item.role,
        parts: [{ text: item.text }]
      }));

      contents.push({
        role: "user",
        parts: [{ text: promptText }]
      });

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
          contents: contents,
          generationConfig: { temperature: 0.85 }
        })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);
      return data.candidates[0].content.parts[0].text;
    }

    async function startWorld() {
      const scenario = document.getElementById("scenarioInput").value.trim() || "Fantasia sombria medieval.";
      const storyBox = document.getElementById("storyBox");
      storyBox.innerHTML = `<div style="color: var(--text-muted);"><i>Construindo o cenário inicial...</i></div>`;
      chatHistory = [];

      try {
        const prompt = `Cenário definido pelo jogador: ${scenario}. Descreva o ambiente inicial, a atmosfera e a cena ao redor do jogador. NÃO fale nem aja pelo jogador.`;
        const reply = await callGemini(prompt);
        if (!reply) return;

        chatHistory.push({ role: "user", text: prompt });
        chatHistory.push({ role: "model", text: reply });

        storyBox.innerHTML = `<div class="turn-narrator">${reply}</div><hr class="divider">`;
      } catch (err) {
        storyBox.innerHTML += `<div style="color: #ef4444;">Erro: ${err.message}</div>`;
      }
    }

    async function sendAction() {
      const input = document.getElementById("actionInput");
      const userAction = input.value.trim();
      if (!userAction) return;

      const scenario = document.getElementById("scenarioInput").value.trim();
      const storyBox = document.getElementById("storyBox");

      if (chatHistory.length === 0) {
        storyBox.innerHTML = "";
      }

      storyBox.innerHTML += `<div class="turn-user">Você: ${userAction}</div>`;
      input.value = "";

      const loadingId = "loading-" + Date.now();
      storyBox.innerHTML += `<div id="${loadingId}" style="color: var(--text-muted);"><i>Narrando consequências...</i></div>`;
      storyBox.scrollTop = storyBox.scrollHeight;

      const reinforcedPrompt = `Contexto do Cenário: ${scenario}
Ação do Jogador: ${userAction}
[Lembrete: Narre apenas a reação do ambiente e dos NPCs com riqueza sensorial e emocional. NUNCA fale, pense ou aja pelo jogador.]`;

      try {
        const reply = await callGemini(reinforcedPrompt);
        document.getElementById(loadingId)?.remove();
        if (!reply) return;

        chatHistory.push({ role: "user", text: reinforcedPrompt });
        chatHistory.push({ role: "model", text: reply });

        storyBox.innerHTML += `<div class="turn-narrator">${reply}</div><hr class="divider">`;
        storyBox.scrollTop = storyBox.scrollHeight;
      } catch (err) {
        document.getElementById(loadingId)?.remove();
        storyBox.innerHTML += `<div style="color: #ef4444;">Erro na API: ${err.message}</div>`;
      }
    }

    function clearStory() {
      chatHistory = [];
      document.getElementById("storyBox").innerHTML = `<span style="color: var(--text-muted);"><i>Histórico limpo. Pronto para uma nova campanha.</i></span>`;
    }

    function exportStory() {
      const text = document.getElementById("storyBox").innerText;
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "campanha-rpg.txt";
      a.click();
    }
  </script>
</body>
</html>
